[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-hub-selection"
version = "0.1.0"
description = "Adaptive Selector-Conductor learning for cost-skew-aware hub selection"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21",
  "torch>=1.13",
  "tensorboard>=2.10",
]

[tool.setuptools]
packages = ["models"]
